:root{

    --blue:#7FA6F2; --blue-soft:#1C3366; --on-blue:#0B1630;

    --blue:#7FA6F2; --blue-soft:#1C3366; --on-blue:#0B1630;

    --neg:#F28282; --neg-soft:#4A2026;
    --amber:#D9AA4E; --amber-text:#E8C47E; --amber-soft:#3D3218; --on-amber:#1A1305;
    --grey:#93A0B8; --grey-soft:#263149;

}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.lb{fill:var(--logo-b)} .lg{fill:var(--logo-g)} .lt{fill:var(--logo-t)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.brand .logo-mark{height:34px;width:auto;display:block}
.brand .logo-word{height:19px;width:auto;display:block}
.brand .app{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);padding-left:10px;margin-left:2px;border-left:1px solid var(--line);white-space:nowrap}
.logo-full{display:block;height:auto;width:min(260px,70vw);margin:0 0 26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#graph svg{user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:30px;font-weight:700;color:var(--heading)}
h3{font-size:21px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{background:var(--surface);border-bottom:3px solid var(--gold-bar)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}

.brand svg{flex:none}
@media (max-width:520px){.brand .logo-word{height:15px}.brand .logo-mark{height:28px}.brand .app{display:none}}
.save{font-size:14px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:var(--on-status)}
.btn.small{min-height:36px;padding:5px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=email],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
textarea{min-height:130px;resize:vertical}


main{padding:28px 0 64px}
.lead{color:var(--muted);max-width:62ch;margin-top:8px}
.section{margin-top:30px}
.section > h3{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.field label{display:block;font-weight:700;margin-bottom:5px}
.field .hint{font-size:14px;color:var(--muted);margin-top:4px}
.field.full{grid-column:1/-1}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:16px;max-width:70ch}


.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;cursor:pointer;flex:none;font-size:18px;color:var(--muted)}
.x:hover{color:var(--neg);border-color:var(--neg)}


.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.q{margin-top:22px}
.q-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.q-head strong{font-size:18px}
.q-head span{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.pos.on{background:var(--pos-fill);border-color:var(--pos-fill);color:var(--on-pos);font-weight:700}
.chip.neg.on{background:var(--neg);border-color:var(--neg);color:var(--on-status);font-weight:700}


.graph-layout{margin-top:20px}
.graph-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.graph-tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.graph-tools label{display:flex;gap:7px;align-items:center;cursor:pointer}
.graph-tools input{width:18px;height:18px;accent-color:var(--blue)}
.graph-tools .spacer{margin-left:auto}
#graph{overflow-x:auto}
#graph svg{display:block;width:100%;min-width:660px;height:auto}
.node{cursor:grab;touch-action:none}
.node:focus{outline:none}
.node:focus-visible circle.body{stroke:var(--blue);stroke-width:5}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%}
.legend i.l{width:26px;height:0;border-radius:0;border-top:3px solid var(--pos)}
.legend i.l.n{border-top:3px dashed var(--neg)}
.i-popular{background:var(--pos-fill)} .i-rechazo{background:var(--neg)} .i-controversial{background:var(--amber)} .i-invisible{background:var(--grey)} .i-promedio{background:var(--surface);border:2px solid var(--ink)}
#detail{padding:12px 16px;border-bottom:1px solid var(--line)}
#detail .who-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#detail .hint{color:var(--muted);font-size:15px}
#detail h3{margin:0;font-size:19px}
#detail dl{margin:10px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px}
#detail dt{font-weight:700;font-size:14px}
#detail dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.badge{display:inline-block;border-radius:999px;padding:2px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.badge.popular{background:var(--pos-soft);color:var(--pos-text)}
.badge.rechazo{background:var(--neg-soft);color:var(--neg)}
.badge.controversial{background:var(--amber-soft);color:var(--amber-text)}
.badge.invisible{background:var(--grey-soft);color:var(--grey)}
.badge.promedio{background:transparent;color:var(--muted);border:1px solid var(--line)}

.attention{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.attention h4{margin:0 0 4px;font-size:17px}
.attention p.why{font-size:14px;color:var(--muted);margin-bottom:8px}
.attention ul{margin:0;padding:0;list-style:none}
.attention li{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.attention li span{color:var(--muted);font-size:14px;text-align:right}
.attention .col{border-top:4px solid var(--neg);padding-top:12px}
.attention .col.b{border-top-color:var(--grey)} .attention .col.c{border-top-color:var(--amber)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.results{border-collapse:collapse;width:100%;min-width:640px}
.results th,.results td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}
.results th:first-child,.results td:first-child{text-align:left}
.results th{font-size:14px;color:var(--muted);font-weight:700}
.results tr:last-child td{border-bottom:0}
.linkish{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.method{font-size:14px;color:var(--muted);max-width:75ch;margin-top:14px}

.drop{border:2px dashed var(--line);border-radius:16px;background:var(--surface);padding:46px 20px;text-align:center;margin-top:22px}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop-title{font-family:var(--display);font-weight:700;font-size:28px}
label.btn{display:inline-flex;align-items:center}
label.btn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.sum{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pos);border-radius:0 10px 10px 0;padding:12px 16px;margin-top:14px;max-width:70ch}
table.map th,table.map td{text-align:left;vertical-align:top}
table.map td:first-child{max-width:360px}
table.map td.ex{color:var(--muted);font-size:15px;max-width:260px;overflow-wrap:anywhere}
table.map select{min-height:40px;padding:5px 10px;min-width:210px}
.vals{display:grid;gap:6px;margin-top:8px}
.vals label{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center;font-size:15px}
.vals select{min-width:0}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.import{max-width:760px}
.import h2{font-size:clamp(28px,5vw,40px)}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.qlist{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:7px;max-width:84ch}
.qlist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:baseline}
.dups{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 12px 12px 0;padding:14px 18px;margin-top:18px;max-width:84ch}
.dups ul{list-style:none;margin:10px 0 0;padding:0}
.dups li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.qrows,.srows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qrows li,.srows li{display:grid;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.qrows li:last-child,.srows li:last-child{border-bottom:0}
.qrows li{grid-template-columns:minmax(0,1fr) 150px 120px}
.qrows input,.qrows .btn{min-height:40px}
.srows li{grid-template-columns:minmax(0,1.3fr) 104px minmax(0,1fr) auto 40px}
.qrows select,.srows select,.srows input{min-height:40px;padding:6px 10px}
.srows .st{font-size:14px;color:var(--muted)}
select.mini{width:auto;max-width:300px;min-height:38px;padding:4px 10px}
.graph-tools label select{margin-left:2px}

.entry{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;margin-top:12px;align-items:start}
.who-list{display:flex;flex-direction:column;gap:3px;padding:2px}
.who{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:7px 10px;cursor:pointer;min-height:40px}
.who:hover{background:var(--surface)}
.who.on{background:var(--surface);border-color:var(--blue);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--grey);flex:none}
.dot.ok{background:var(--pos);border-color:var(--pos)}
.mqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mqs li{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:8px;align-items:center}
.manual-opt{margin-top:30px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.manual-opt h3{margin-bottom:2px}
.x:disabled{opacity:.35;cursor:not-allowed}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;flex:none}
.theme-btn:hover{border-color:var(--blue);color:var(--blue)}
.top .save{white-space:nowrap}
@media (max-width:1240px){.top .acct{display:none}}
@media (max-width:1000px){.brand .app{display:none}}
.auth{padding-top:30px}
input.code{font-size:26px;letter-spacing:.3em;text-align:center}
.acct{font-size:14px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){
  .entry{grid-template-columns:minmax(0,1fr)}
  .who-list{flex-direction:row;flex-wrap:wrap}
  .mqs li{grid-template-columns:minmax(0,1fr) 40px}
  .mqs li input{grid-column:1/-1}
  .qrows li{grid-template-columns:minmax(0,1fr) auto}
  .qrows .qt{grid-column:1/-1}
  .srows li{grid-template-columns:minmax(0,1fr) auto 40px}
  .srows .nm{grid-column:1/-1}
  .srows .st{display:none}
  #detail dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields{grid-template-columns:minmax(0,1fr)}
  h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function firstName(n){return String(n).trim().split(/\s+/)[0];}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}

/* ---------- teacher accounts (Supabase + Go High Level) ---------- */
var CFG=window.SOCIOGRAMA_CONFIG||{};
if(CFG.url)CFG.url=String(CFG.url).trim().replace(/\/+$/,'').replace(/\/(rest|auth)\/v1$/i,'');
var CLOUD=!!(CFG.url&&CFG.key&&/^https:\/\//.test(CFG.url)&&!/PEGA/i.test(CFG.url+CFG.key));
var SB=null,cloud={status:'starting',user:null,email:'',step:'email',msg:'',busy:false,checkedAt:0};
function cloudKey(){return cloud.user?'sociograma.cloud.'+cloud.user.id:null;}
/* "Recordarme": when on, the login and a copy of the classes stay in localStorage; when off, only in sessionStorage (gone when the browser closes). */
var REMEMBER_KEY='sociograma.remember';
function remembered(){try{return localStorage.getItem(REMEMBER_KEY)!=='0';}catch(e){return true;}}
function keepStore(){try{return remembered()?localStorage:sessionStorage;}catch(e){return null;}}
function dropStore(){try{return remembered()?sessionStorage:localStorage;}catch(e){return null;}}
var authStorage={
  getItem:function(k){try{var v=localStorage.getItem(k);return v!==null?v:sessionStorage.getItem(k);}catch(e){return null;}},
  setItem:function(k,v){try{keepStore().setItem(k,v);dropStore().removeItem(k);}catch(e){}},
  removeItem:function(k){try{localStorage.removeItem(k);}catch(e){}try{sessionStorage.removeItem(k);}catch(e){}}
};
function cloudMsg(e,fallback,isCode){
  var m=String(e&&e.message||'').toLowerCase();
  if(/rate|seconds|too many|security purposes/.test(m))return 'Espera un minuto antes de pedir otro código.';
  if(isCode&&/expired|invalid|token/.test(m))return 'El código no es correcto o ya venció. Pide uno nuevo.';
  if(/fetch|network|failed to/.test(m))return 'No hay conexión. Revisa el internet e intenta de nuevo.';
  return fallback;
}
function cloudDoc(){
  return {set:function(data){
    return SB.from('teacher_data').upsert({owner:cloud.user.id,data:data,updated_at:new Date().toISOString()}).then(function(r){
      if(!r.error)return;
      var m=String(r.error.message||'').toLowerCase();
      throw {code:(r.error.code==='42501'||/row-level|policy|permission/.test(m))?'revoked':'unavailable'};
    },function(){throw {code:'unavailable'};});
  }};
}
function cloudSaveFailed(e){
  if(e&&e.code==='revoked'){checkActive(true);return;}
  setSave('error');
  setTimeout(function(){if(cloud.status==='ready'&&caps.doc)pushRemote();},8000);
}
function bootCloud(){
  if(!window.supabase||!window.supabase.createClient){cloud.status='error';cloud.msg='No se pudo cargar el sistema de cuentas. Revisa la conexión y recarga la página.';render();return;}
  SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sociograma-auth',storage:authStorage}});
  SB.auth.onAuthStateChange(function(ev,session){
    if(ev==='SIGNED_OUT'){cloudSignedOut();}
    else if(session&&session.user&&(!cloud.user||cloud.user.id!==session.user.id)&&cloud.status!=='checking'){cloudSignedIn(session.user);}
  });
  SB.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s&&s.user)cloudSignedIn(s.user);
    else{cloud.status='login';render();}
  },function(){cloud.status='login';render();});
}
function cloudSignedIn(user){
  cloud.user=user;cloud.email=user.email||cloud.email;cloud.status='checking';cloud.msg='';render();
  checkActive(false);
}
function checkActive(fromSave){
  if(!SB||!cloud.user)return;
  SB.from('teachers').select('active').maybeSingle().then(function(r){
    if(r.error){throw r.error;}
    cloud.checkedAt=Date.now();
    if(!r.data||!r.data.active){lockOut();return;}
    if(fromSave&&cloud.status==='ready'){pushRemote();return;}
    if(cloud.status!=='ready')loadCloudData();
  }).catch(function(e){
    if(fromSave){setSave('error');return;}
    cloud.status='error';cloud.msg=cloudMsg(e,'No se pudo revisar tu suscripción. Intenta de nuevo en un momento.');render();
  });
}
function lockOut(){
  caps.doc=null;clearTimeout(saveTimer);
  state={v:2,updatedAt:0,activeId:null,classes:[]};imp=null;
  cloud.status='inactive';render();
}
function loadCloudData(){
  SB.from('teacher_data').select('data').maybeSingle().then(function(r){
    if(r.error)throw r.error;
    var remote=r.data?migrate(JSON.parse(JSON.stringify(r.data.data||{}))):null,cached=null,legacy=null;
    try{var raw=authStorage.getItem(cloudKey());cached=raw?migrate(JSON.parse(raw)):null;}catch(e){}
    try{var lr=localStorage.getItem(LS_KEY);legacy=lr?migrate(JSON.parse(lr)):null;}catch(e){}
    var push=false;
    if(remote){state=remote;if(cached&&(cached.updatedAt||0)>(remote.updatedAt||0)){state=cached;push=true;}}
    else if(cached&&cached.classes.length){state=cached;push=true;}
    else{state={v:2,updatedAt:0,activeId:null,classes:[]};}
    if(legacy&&legacy.classes.length){
      var have={};state.classes.forEach(function(c){have[c.id]=1;});
      legacy.classes.forEach(function(c){if(!have[c.id])state.classes.push(c);});
      if(!state.activeId&&state.classes.length)state.activeId=state.classes[0].id;
      push=true;
    }
    caps.doc=cloudDoc();cloud.status='ready';
    ui.importing=false;ui.view='results';ui.manualOn=false;
    saveLocal();render();setSave('account');
    if(push){state.updatedAt=Date.now();saveLocal();caps.doc.set(JSON.parse(JSON.stringify(state))).then(function(){
      try{localStorage.removeItem(LS_KEY);}catch(e){}setSave('account');
    },cloudSaveFailed);}
  }).catch(function(e){cloud.status='error';cloud.msg=cloudMsg(e,'No se pudieron cargar tus clases. Intenta de nuevo en un momento.');render();});
}
function cloudSignedOut(){
  var k=cloudKey();if(k)authStorage.removeItem(k);
  caps.doc=null;clearTimeout(saveTimer);cloud.user=null;cloud.step='email';cloud.status='login';cloud.msg='';
  state={v:2,updatedAt:0,activeId:null,classes:[]};imp=null;ui.importing=false;ui.manualOn=false;ui.view='results';
  render();
}

function zs(arr){
  var n=arr.length||1,mean=0,i;for(i=0;i<arr.length;i++)mean+=arr[i];mean/=n;
  var v=0;for(i=0;i<arr.length;i++)v+=(arr[i]-mean)*(arr[i]-mean);
  var sd=Math.sqrt(v/n);
  return arr.map(function(x){return sd>1e-9?(x-mean)/sd:0;});
}
function analyze(c,qf){
  var ids=c.students.map(function(s){return s.id;}),has={},m={},names={};
  c.students.forEach(function(s){has[s.id]=true;names[s.id]=s.name;});
  ids.forEach(function(id){m[id]={id:id,er:0,rr:0,pos:[],neg:[],posBy:[],negBy:[],mutPos:0,mutNeg:0,answered:!!c.answers[id],status:'promedio'};});
  var qs=c.questions.filter(function(q){return q.kind!=='off'&&(!qf||qf==='all'||q.id===qf);});
  ids.forEach(function(id){
    var a=c.answers[id];if(!a)return;
    qs.forEach(function(q){
      var pos=q.kind==='pos';
      (a[q.id]||[]).forEach(function(t){
        if(!has[t]||t===id)return;
        var mine=pos?m[id].pos:m[id].neg;
        if(mine.indexOf(t)>=0)return;
        mine.push(t);
        if(pos){m[t].posBy.push(id);m[t].er++;}else{m[t].negBy.push(id);m[t].rr++;}
      });
    });
  });
  var mutual=0,answered=0;
  ids.forEach(function(id){
    m[id].mutPos=m[id].pos.filter(function(t){return m[t].pos.indexOf(id)>=0;}).length;
    m[id].mutNeg=m[id].neg.filter(function(t){return m[t].neg.indexOf(id)>=0;}).length;
    mutual+=m[id].mutPos;if(m[id].answered)answered++;
  });
  var zE=zs(ids.map(function(id){return m[id].er;})),zR=zs(ids.map(function(id){return m[id].rr;}));
  var zSP=zs(zE.map(function(v,i){return v-zR[i];})),zSI=zs(zE.map(function(v,i){return v+zR[i];}));
  if(answered>=3){
    ids.forEach(function(id,i){
      var s='promedio';
      if(zSP[i]>1&&zE[i]>0&&zR[i]<0)s='popular';
      else if(zSP[i]<-1&&zE[i]<0&&zR[i]>0)s='rechazo';
      else if(zSI[i]>1&&zE[i]>0&&zR[i]>0)s='controversial';
      else if(zSI[i]<-1&&zE[i]<0&&zR[i]<0)s='invisible';
      m[id].status=s;
    });
  }
  return {ids:ids,m:m,names:names,answered:answered,mutualPairs:mutual/2};
}

function mergeStudents(c,from,into){
  if(from===into)return;
  if(c.answers[from]&&!c.answers[into])c.answers[into]=c.answers[from];
  delete c.answers[from];
  Object.keys(c.answers).forEach(function(k){
    var a=c.answers[k];
    Object.keys(a).forEach(function(q){
      var out=[];
      a[q].forEach(function(t){if(t===from)t=into;if(t!==k&&out.indexOf(t)<0)out.push(t);});
      a[q]=out;
    });
  });

  c.notDup=c.notDup.filter(function(k){return k.split('|').indexOf(from)<0;});

function dupSuggestions(c,A){
  var out=[],S=c.students,keys=S.map(function(s){return norm(s.name);}),i,j,a,b,key,close,wi,wj,swap;
  for(i=0;i<S.length;i++)for(j=i+1;j<S.length;j++){
    if(c.answers[S[i].id]&&c.answers[S[j].id])continue;
    a=keys[i];b=keys[j];if(!a||!b)continue;
    close=a===b||tokSub(a,b,false)||tokSub(b,a,false)||(Math.abs(a.length-b.length)<=2&&lev(a,b)<=2);
    if(!close)continue;
    key=[S[i].id,S[j].id].sort().join('|');
    if(c.notDup.indexOf(key)>=0)continue;
    wi=A.m[S[i].id].er+A.m[S[i].id].rr;wj=A.m[S[j].id].er+A.m[S[j].id].rr;
    swap=wi>wj||(wi===wj&&a.length>b.length);
    out.push({from:swap?S[j]:S[i],into:swap?S[i]:S[j],key:key});
    if(out.length>=12)return out;
  }
  return out;
}

function parseDelimited(text){

    ent(k,tidyName(r[wc])||r[wc]).responded=true;
    if(resp[k])dup++;else order.push(k);
    resp[k]=r;
  });
  var known={};Object.keys(entries).forEach(function(k){known[k]=1;});
  picks.forEach(function(u){
    if(u.kind!=='gridName')return;
    u.cols.forEach(function(c){var k=norm(u.labels[c]);if(!k)return;known[k]=1;var e=ent(k,tidyName(u.labels[c])||u.labels[c]);if(!e.ment){e.text=tidyName(u.labels[c])||u.labels[c];e.ment=true;}});
  });
  var questions=[],raw=[];
  picks.forEach(function(u,ix){
    if(u.kind==='gridName'){
      u.valueList.forEach(function(v,vi){
        var p=u.values[v];if(p!=='pos'&&p!=='neg')return;
        var qid='q'+ix+'v'+vi;
        questions.push({id:qid,text:clip(T.matrix?'Marca «'+v+'» en la matriz':u.title+': «'+v+'»',160),kind:p});
        order.forEach(function(fk){var r=resp[fk];u.cols.forEach(function(c){if(r[c]===v){var k=norm(u.labels[c]);if(k){entries[k].count++;raw.push({from:fk,q:qid,k:k});}}});});
      });
      return;
    }
    var id='q'+ix;
    questions.push({id:id,text:clip(u.title,160),kind:u.role});
    order.forEach(function(fk){
      var r=resp[fk];
      u.cols.forEach(function(c){
        splitNames(r[c],known).forEach(function(t){
          var name=tidyName(t),k=norm(name);
          if(!k||NOBODY[k])return;
          if(!entries[k]&&!nameLike(name)){junk++;return;}
          mention(k,name);raw.push({from:fk,q:id,k:k});
        });
      });
    });
  });
  var cl=clusterNames(entries),ans={},posN=0,negN=0,kindOf={};
  questions.forEach(function(q){kindOf[q.id]=q.kind;});
  order.forEach(function(fk){var ck=cl.res[fk];ans[ck]=ans[ck]||{};questions.forEach(function(q){ans[ck][q.id]=ans[ck][q.id]||[];});});
  raw.forEach(function(x){
    var f=cl.res[x.from],t=cl.res[x.k];if(!t||t===f)return;
    var l=ans[f][x.q];if(l.indexOf(t)>=0)return;
    l.push(t);if(kindOf[x.q]==='pos')posN++;else negN++;
  });
  var students=cl.clusters.map(function(c){return {key:c.k,name:c.name};});
  students.sort(function(a,b){return a.name.localeCompare(b.name,'es');});

}
function buildImport(){
  var T=imp.T,who=null,grp=null,picks=[];
  imp.units.forEach(function(u){
    if(u.role==='who')who=u;else if(u.role==='group')grp=u;
    else if(u.role==='pos'||u.role==='neg'||u.role==='use')picks.push(u);
  });
  if(!who)return {error:'who',classes:[]};
  if(!picks.length)return {error:'picks',classes:[]};
  var wc=who.cols[0],gc=grp?grp.cols[0]:-1,parts={},order=[],noName=0;
  T.rows.forEach(function(r){
    if(!norm(r[wc])){noName++;return;}
    var g=gc>=0?r[gc]:'',gk=gc>=0?(norm(g)||'sin grupo'):'_';
    if(!parts[gk]){parts[gk]={label:gc>=0?((imp.given?imp.className+' ':'')+(g||'Sin grupo')):imp.className,rows:[]};order.push(gk);}
    parts[gk].rows.push(r);
  });
  return {classes:order.map(function(gk){return buildClass(parts[gk],wc,picks);}),noName:noName,grouped:gc>=0};
}
function createFromImport(){
  var made=[];
  imp.result.classes.forEach(function(k){
    if(k.students.length<3)return;
    var c={id:uid('c'),name:String(k.name||'Clase importada').slice(0,60),questions:k.questions.map(function(q){return {id:q.id,text:q.text,kind:q.kind};}),students:[],answers:{},notDup:[]},idOf={};
    k.students.forEach(function(st){var id=uid('s');idOf[st.key]=id;c.students.push({id:id,name:st.name});});
    Object.keys(k.ans).forEach(function(fk){
      var a={};Object.keys(k.ans[fk]).forEach(function(q){a[q]=k.ans[fk][q].map(function(t){return idOf[t];});});
      c.answers[idOf[fk]]=a;
    });
    state.classes.push(c);made.push(c);
  });
  if(!made.length){toast('Se necesitan al menos 3 estudiantes');return;}
  state.activeId=made[0].id;imp=null;
  ui.importing=false;ui.view='results';ui.q='all';ui.selected=null;ui.editSid=null;ui.impName='';ui.impPaste='';ui.impMsg='';
  $('#panel').innerHTML='';
  touch();render();window.scrollTo(0,0);
  toast(made.length===1?made[0].students.length+' estudiantes y '+made[0].questions.length+' preguntas importadas':made.length+' clases creadas');
}
function startReview(rows,name){
  var el=$('#imp-class');if(el)ui.impName=el.value;
  el=$('#imp-paste');if(el)ui.impPaste=el.value;
  var T=toTable(rows);
  if(T.error){impError(T.error);return;}
  var given=ui.impName.trim();
  imp={file:name,T:T,units:null,className:(given||guessClassName(name)).slice(0,60),given:!!given,result:null};
  imp.units=makeUnits(T);

  ui.impMsg='';ui.importing=true;render();window.scrollTo(0,0);
}

var ROLES={plain:[['ignore','No usar'],['who','Nombre de quien responde'],['group','Clase o grado'],['pos','Elección'],['neg','Rechazo']],gridValue:[['ignore','No usar'],['pos','Elección'],['neg','Rechazo']],gridName:[['ignore','No usar'],['use','Usar las marcas']]};
function viewImportMap(){
  var R=imp.result,T=imp.T,ok=!R.error&&R.classes.some(function(k){return k.students.length>=3;});
  var h='<h2>Revisa las columnas</h2><p class="lead">'+esc(imp.file)+': '+T.rows.length+' '+(T.rows.length===1?'fila':'filas')+' de respuestas y '+T.headers.length+' columnas.'+(T.matrix?' Se leyó como matriz de nombres contra nombres.':'')+'</p>';
  if(R.error==='who')h+='<p class="note" role="alert">No se reconoció la columna con el nombre de quien responde. Elígela abajo en "Uso".</p>';
  else if(R.error==='picks')h+='<p class="note" role="alert">No se reconocieron las preguntas. Marca abajo cuáles son de Elección y cuáles de Rechazo.</p>';
  else{
    R.classes.forEach(function(k){
      h+='<div class="sum"><strong>'+esc(k.name)+'</strong><br>'+k.students.length+' estudiantes, '+k.responded+' respondieron. '+k.posN+' elecciones y '+k.negN+' rechazos.'+
        (k.dup?' '+k.dup+' '+(k.dup===1?'respuesta repetida':'respuestas repetidas')+': se usó la más reciente.':'')+
        (k.students.length<3?' Se necesitan al menos 3 estudiantes.':'')+'</div>';
    });
    if(R.noName)h+='<p class="note">'+R.noName+' '+(R.noName===1?'fila no tiene nombre y no se usó.':'filas no tienen nombre y no se usaron.')+'</p>';
  }
  h+='<div class="section"><h3>Columnas del archivo</h3><div class="table-wrap"><table class="results map"><thead><tr><th scope="col">Columna</th><th scope="col">Ejemplo</th><th scope="col">Uso</th></tr></thead><tbody>';
  imp.units.forEach(function(u,ix){
    var kind=u.kind==='grid'?'gridValue':u.kind;
    h+='<tr><td>'+esc(clip(u.title,110))+(u.kind!=='plain'?' <span class="save">('+u.cols.length+' columnas)</span>':'')+'</td><td class="ex">'+esc(clip(u.sample||'',70))+'</td><td><select aria-label="Uso de '+esc(clip(u.title,60))+'" data-change="impRole" data-u="'+ix+'">'+optionsHTML(ROLES[kind],u.role)+'</select>';
    if(u.kind==='gridName'&&u.role==='use'){
      h+='<div class="vals">'+u.valueList.map(function(v,vi){return '<label><span>Marca «'+esc(clip(v,40))+'»</span><select data-change="impVal" data-u="'+ix+'" data-v="'+vi+'">'+optionsHTML([['pos','Elección'],['neg','Rechazo'],['ignore','No usar']],u.values[v])+'</select></label>';}).join('')+'</div>';
    }
    h+='</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="section"><div class="field" style="max-width:420px"><label for="map-class">Nombre de la clase</label><input type="text" id="map-class" maxlength="60" data-change="impClass" value="'+esc(imp.className)+'"></div></div>';
  h+='<div class="section row"><button class="btn primary" data-action="impCreate"'+(ok?'':' disabled')+'>Crear sociograma</button><button class="btn" data-action="impOpen">Subir otro archivo</button><button class="btn" data-action="impCancel">Cancelar</button></div>';
  return h;
}
function impRefresh(sel){
  imp.result=buildImport();render();
  if(sel){var el=document.querySelector(sel);if(el)el.focus();}
}
function namesOf(A,list){return list.length?list.map(function(id){return esc(A.names[id]);}).join(', '):'Nadie';}
function detailHTML(c,A){
  var id=ui.selected;
  if(!id||!A.m[id])return '<p class="hint">Toca a un estudiante en el mapa para ver sus elecciones y rechazos. Arrastra los círculos para ordenar el mapa.</p>';
  var n=A.m[id];
  return '<div class="who-line"><h3>'+esc(A.names[id])+'</h3><span class="badge '+n.status+'">'+STATUS[n.status]+'</span>'+(n.answered?'':'<span class="hint">No respondió el formulario.</span>')+'</div>'+
   '<dl><div><dt>Elige a</dt><dd>'+namesOf(A,n.pos)+'</dd></div><div><dt>Recibe elección de</dt><dd>'+namesOf(A,n.posBy)+'</dd></div>'+
   '<div><dt>Rechaza a</dt><dd>'+namesOf(A,n.neg)+'</dd></div><div><dt>Recibe rechazo de</dt><dd>'+namesOf(A,n.negBy)+'</dd></div></dl>';
}
function viewResults(c){
  var active=c.questions.filter(function(q){return q.kind!=='off';});
  if(ui.q!=='all'&&!active.some(function(q){return q.id===ui.q;}))ui.q='all';
  var A=analyze(c,ui.q),all=ui.q==='all'?A:analyze(c,'all');
  var h='<div class="headrow"><h2>Sociograma de '+esc(c.name)+'</h2><div class="row"><button class="btn" data-action="view" data-view="entry">Anotar respuestas</button><button class="btn" data-action="view" data-view="edit">Editar</button></div></div>';
  if(c.students.length<3||A.answered<1||!active.length){
    if(c.students.length>=3&&active.length&&A.answered<1)return h+'<p class="lead">Todavía no hay respuestas anotadas.</p><div class="row" style="margin-top:18px"><button class="btn primary" data-action="view" data-view="entry">Anotar respuestas</button></div>';
    return h+'<p class="lead">'+(c.students.length<3?'Esta clase tiene menos de 3 estudiantes.':'Ninguna pregunta está en uso.')+' Toca Editar para corregirlo.</p>';
  }

/* ---------- graph ---------- */
var GW=900,GH=600;
function setCanvas(n){var f=n<=16?1:n<=24?1.2:n<=32?1.4:1.65;GW=Math.round(900*f);GH=Math.round(600*f);}
function nodeR(n){return 15+Math.min(n.er,8)*2.6;}
function computeLayout(c,A,force){
  var ids=A.ids,n=ids.length;
  setCanvas(n);
  var key=ids.map(function(id){return id+':'+A.m[id].pos.join(',')+'|'+A.m[id].neg.join(',');}).join(';');
  var cached=layoutCache[c.id];
  if(!force&&cached&&cached.key===key)return cached.pos;
  var P={},k=120,i,j,it;
  ids.forEach(function(id,ix){var a=2*Math.PI*ix/n;P[id]={x:Math.cos(a)*220,y:Math.sin(a)*220,dx:0,dy:0};});
  var ITER=380;
  for(it=0;it<ITER;it++){
    var temp=55*(1-it/ITER)+1;
    for(i=0;i<n;i++){P[ids[i]].dx=0;P[ids[i]].dy=0;}
    for(i=0;i<n;i++)for(j=i+1;j<n;j++){
      var a=P[ids[i]],b=P[ids[j]],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||0.01,f=k*k/d;
      var neg=A.m[ids[i]].neg.indexOf(ids[j])>=0||A.m[ids[j]].neg.indexOf(ids[i])>=0;
      if(neg)f*=1.5;
      a.dx+=dx/d*f;a.dy+=dy/d*f;b.dx-=dx/d*f;b.dy-=dy/d*f;
    }
    for(i=0;i<n;i++){
      var src=P[ids[i]];
      A.m[ids[i]].pos.forEach(function(t){
        var dst=P[t],ex=src.x-dst.x,ey=src.y-dst.y,ed=Math.sqrt(ex*ex+ey*ey)||0.01,ef=ed*ed/k*0.55;
        src.dx-=ex/ed*ef;src.dy-=ey/ed*ef;dst.dx+=ex/ed*ef;dst.dy+=ey/ed*ef;
      });
      src.dx-=src.x*1.3;src.dy-=src.y*1.3;
    }
    for(i=0;i<n;i++){
      var p=P[ids[i]],dl=Math.sqrt(p.dx*p.dx+p.dy*p.dy)||0.01,st=Math.min(dl,temp);
      p.x+=p.dx/dl*st;p.y+=p.dy/dl*st;
    }
  }
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  ids.forEach(function(id){var p=P[id];minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  var padX=70,padT=50,padB=70,sx=(GW-2*padX)/Math.max(maxX-minX,1),sy=(GH-padT-padB)/Math.max(maxY-minY,1);
  ids.forEach(function(id){var p=P[id];p.x=padX+(p.x-minX)*sx;p.y=padT+(p.y-minY)*sy;});
  for(it=0;it<40;it++){
    for(i=0;i<n;i++)for(j=i+1;j<n;j++){
      var u=P[ids[i]],v=P[ids[j]],ox=u.x-v.x,oy=u.y-v.y,od=Math.sqrt(ox*ox+oy*oy)||0.01,min=nodeR(A.m[ids[i]])+nodeR(A.m[ids[j]])+34;
      if(od<min){var push=(min-od)/2;u.x+=ox/od*push;u.y+=oy/od*push;v.x-=ox/od*push;v.y-=oy/od*push;}
    }
    ids.forEach(function(id){var p=P[id];p.x=clamp(p.x,45,GW-45);p.y=clamp(p.y,40,GH-52);});
  }
  var out={};ids.forEach(function(id){out[id]={x:P[id].x,y:P[id].y};});
  layoutCache[c.id]={key:key,pos:out};
  return out;
}
function colors(){
  var s=getComputedStyle(document.documentElement),g=function(n){return s.getPropertyValue(n).trim();};
  return {pos:g('--pos'),posFill:g('--pos-fill'),onPos:g('--on-pos'),neg:g('--neg'),amber:g('--amber'),onAmber:g('--on-amber'),grey:g('--grey'),ink:g('--ink'),surface:g('--surface'),blue:g('--blue'),on:g('--on-status')};
}
function graphSVG(c,A,P,o){
  var col=o.colors,sel=o.selected&&A.m[o.selected]?o.selected:null,m=A.m,ids=A.ids,show=o.show,f=function(v){return v.toFixed(1);};
  function related(id){if(!sel||id===sel)return true;var s=m[sel];return s.pos.indexOf(id)>=0||s.neg.indexOf(id)>=0||s.posBy.indexOf(id)>=0||s.negBy.indexOf(id)>=0;}
  function edge(a,b,t,mutual,curved){
    var pa=P[a],pb=P[b],dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.sqrt(dx*dx+dy*dy)||1;dx/=d;dy/=d;
    var ra=nodeR(m[a]),rb=nodeR(m[b])+(mutual?0:4);
    var x1=pa.x+dx*ra,y1=pa.y+dy*ra,x2=pb.x-dx*rb,y2=pb.y-dy*rb,path;
    if(curved){path='M'+f(x1)+' '+f(y1)+'Q'+f((x1+x2)/2-dy*curved)+' '+f((y1+y2)/2+dx*curved)+' '+f(x2)+' '+f(y2);}
    else{path='M'+f(x1)+' '+f(y1)+'L'+f(x2)+' '+f(y2);}
    var dim=sel&&a!==sel&&b!==sel;
    return '<path d="'+path+'" fill="none" stroke="'+col[t]+'" stroke-width="'+(mutual?4.5:1.8)+'" stroke-linecap="round"'+(t==='neg'?' stroke-dasharray="'+(mutual?'10 7':'6 5')+'"':'')+(mutual?'':' marker-end="url(#ah-'+t+(o.exp?'-x':'')+')"')+' opacity="'+(dim?0.08:(mutual?0.9:0.7))+'"/>';
  }
  var e='',i,j;
  for(i=0;i<ids.length;i++)for(j=i+1;j<ids.length;j++){
    var a=ids[i],b=ids[j],list=[];
    ['pos','neg'].forEach(function(t){
      if(!show[t])return;
      var ab=m[a][t].indexOf(b)>=0,ba=m[b][t].indexOf(a)>=0;
      if(ab&&ba)list.push([a,b,t,true]);
      else if(!show.mutual){if(ab)list.push([a,b,t,false]);if(ba)list.push([b,a,t,false]);}
    });
    if(!list.length)continue;
    var offs=list.length===1?[0]:list.length===2?[26,-26]:list.length===3?[0,36,-36]:[20,-20,50,-50];
    list.forEach(function(L,ix){e+=edge(L[0],L[1],L[2],L[3],L[0]===a?offs[ix]:-offs[ix]);});
  }
  var nodes='';
  ids.forEach(function(id){
    var n=m[id],p=P[id],r=nodeR(n),fill=col.surface,txt=col.ink,stroke=col.ink,sw=2;
    if(n.status==='popular'){fill=col.posFill;}else if(n.status==='rechazo'){fill=col.neg;}else if(n.status==='controversial'){fill=col.amber;}else if(n.status==='invisible'){fill=col.grey;}
    if(n.status!=='promedio'){txt=n.status==='popular'?col.onPos:n.status==='controversial'?col.onAmber:col.on;stroke=col.surface;}
    nodes+='<g class="node" data-id="'+id+'" tabindex="0" role="button" aria-label="'+esc(A.names[id])+': '+n.er+' elecciones, '+n.rr+' rechazos, '+STATUS[n.status]+'" opacity="'+(related(id)?1:0.18)+'">'+
      (sel===id?'<circle cx="'+f(p.x)+'" cy="'+f(p.y)+'" r="'+f(r+6)+'" fill="none" stroke="'+col.blue+'" stroke-width="3"/>':'')+
      '<circle class="body" cx="'+f(p.x)+'" cy="'+f(p.y)+'" r="'+f(r)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>'+
      '<text x="'+f(p.x)+'" y="'+f(p.y+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="'+txt+'">'+n.er+'</text>'+
      '<text x="'+f(p.x)+'" y="'+f(p.y+r+17)+'" text-anchor="middle" font-size="14" fill="'+col.ink+'" stroke="'+col.surface+'" stroke-width="4" paint-order="stroke" stroke-linejoin="round">'+esc(shortName(A.names[id]))+'</text></g>';
  });
  function marker(t){return '<marker id="ah-'+t+(o.exp?'-x':'')+'" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.5L10 5L0 9.5z" fill="'+col[t]+'"/></marker>';}
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+GW+' '+GH+'"'+(o.exp?' width="'+GW*2+'" height="'+GH*2+'"':'')+' font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif" role="group" aria-label="Mapa del grupo"><defs>'+marker('pos')+marker('neg')+'</defs>'+
    (o.exp?'<rect width="'+GW+'" height="'+GH+'" fill="'+col.surface+'"/>':'')+e+nodes+'</svg>';
}
function drawGraph(){
  var c=cls(),host=$('#graph');if(!c||!host)return;
  var A=analyze(c,ui.q),P=computeLayout(c,A);
  host.innerHTML=graphSVG(c,A,P,{colors:colors(),selected:ui.selected,show:ui.show});
  var d=$('#detail');if(d)d.innerHTML=detailHTML(c,A);
}
var drag=null;
function mountGraph(){
  var host=$('#graph');if(!host)return;
  drawGraph();
  host.onpointerdown=function(e){
    var g=e.target.closest&&e.target.closest('.node');if(!g)return;
    drag={id:g.getAttribute('data-id'),x0:e.clientX,y0:e.clientY,moved:false};
    try{host.setPointerCapture(e.pointerId);}catch(err){}
  };
  host.onpointermove=function(e){
    if(!drag)return;
    if(!drag.moved&&Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)<6)return;
    drag.moved=true;
    var c=cls(),svg=host.querySelector('svg');if(!c||!svg||!layoutCache[c.id])return;
    var r=svg.getBoundingClientRect(),p=layoutCache[c.id].pos[drag.id];if(!p)return;
    p.x=clamp((e.clientX-r.left)/r.width*GW,30,GW-30);p.y=clamp((e.clientY-r.top)/r.height*GH,30,GH-45);
    drawGraph();
  };
  host.onpointerup=function(e){
    if(!drag){if(!(e.target.closest&&e.target.closest('.node'))&&ui.selected){ui.selected=null;drawGraph();}return;}
    var d=drag;drag=null;try{host.releasePointerCapture(e.pointerId);}catch(err){}
    if(!d.moved){ui.selected=ui.selected===d.id?null:d.id;drawGraph();}
  };
  host.onpointercancel=function(){drag=null;};
  host.onkeydown=function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var g=e.target.closest&&e.target.closest('.node');if(!g)return;
    e.preventDefault();var id=g.getAttribute('data-id');
    ui.selected=ui.selected===id?null:id;drawGraph();
    var again=host.querySelector('.node[data-id="'+id+'"]');if(again)again.focus();
  };
}

/* ---------- downloads ---------- */
function fileSlug(c){return (c.name||'clase').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'clase';}
function saveFile(filename,data){
  if(!caps.downloads)return;
  caps.downloads.save({filename:filename,data:data}).then(function(){toast('Archivo descargado');},function(e){
    if(e&&e.code==='declined')return;
    toast(e&&e.code==='rate_limited'?'Espera un momento y vuelve a intentarlo':'No se pudo descargar el archivo');
  });
}
function downloadCSV(){
  var c=cls();if(!c)return;var A=analyze(c,ui.q);
  var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"';};
  var rows=[['Estudiante','Respondió','Lo eligen','Lo rechazan','Elecciones mutuas','Rechazos mutuos','Estatus','Elige a','Rechaza a']];
  A.ids.forEach(function(id){var n=A.m[id];rows.push([A.names[id],n.answered?'Sí':'No',n.er,n.rr,n.mutPos,n.mutNeg,STATUS[n.status],n.pos.map(function(t){return A.names[t];}).join('; '),n.neg.map(function(t){return A.names[t];}).join('; ')]);});
  saveFile('sociograma-'+fileSlug(c)+'.csv','\ufeff'+rows.map(function(r){return r.map(q).join(',');}).join('\r\n'));
}
function downloadPNG(){
  var c=cls();if(!c)return;var A=analyze(c,ui.q),P=computeLayout(c,A);
  var svg=graphSVG(c,A,P,{colors:colors(),selected:null,show:ui.show,exp:true});
  var img=new Image();
  img.onload=function(){
    try{
      var cv=document.createElement('canvas');cv.width=GW*2;cv.height=GH*2;cv.getContext('2d').drawImage(img,0,0,GW*2,GH*2);
      cv.toBlob(function(b){if(b)saveFile('sociograma-'+fileSlug(c)+'.png',b);else toast('No se pudo crear la imagen');},'image/png');
    }catch(e){toast('No se pudo crear la imagen');}
  };
  img.onerror=function(){toast('No se pudo crear la imagen');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- render ---------- */
function render(){
  var keep=$('#imp-class');if(keep)ui.impName=keep.value;
  keep=$('#imp-paste');if(keep)ui.impPaste=keep.value;
  keep=$('#f-add');if(keep)ui.addName=keep.value;keep=$('#f-addq');if(keep)ui.addQ=keep.value;keep=$('#f-addq-kind');if(keep)ui.addQKind=keep.value;
  syncManual();
  renderTop();
  var c=cls(),panel=$('#panel');
  if(CLOUD&&cloud.status!=='ready'){panel.innerHTML=viewCloud();return;}
  if(ui.importing||!c){panel.innerHTML=ui.manualOn?viewManualSetup():imp?viewImportMap():viewImportSource();return;}
  if(ui.view==='edit'){panel.innerHTML=viewEdit(c);return;}
  if(ui.view==='entry'){
    var wl=$('#wholist'),st=wl?wl.scrollTop:0;
    panel.innerHTML=viewEntry(c);
    wl=$('#wholist');if(wl)wl.scrollTop=st;
    return;
  }
  panel.innerHTML=viewResults(c);mountGraph();
}
function unarm(){ui.armed=null;var b=document.querySelector('.btn.armed');if(b){b.classList.remove('armed');b.textContent=b.getAttribute('data-label');}}

/* ---------- actions ---------- */
var actions={
  theme:function(){setTheme(isDark()?'light':'dark');},
  view:function(b){ui.view=b.getAttribute('data-view');ui.selected=null;clearTimeout(armT);ui.armed=null;render();window.scrollTo(0,0);},
  impOpen:function(){imp=null;ui.importing=true;ui.manualOn=false;ui.impMsg='';render();window.scrollTo(0,0);},
  impCancel:function(){imp=null;ui.importing=false;ui.manualOn=false;ui.impMsg='';render();window.scrollTo(0,0);},
  mOpen:function(){var el=$('#imp-class');if(el)ui.impName=el.value;manualState();if(!ui.manual.name)ui.manual.name=ui.impName;ui.manualOn=true;render();window.scrollTo(0,0);var f=$('#m-names');if(f&&ui.manual.name)f.focus();else{f=$('#m-name');if(f)f.focus();}},
  mCancel:function(){syncManual();ui.manualOn=false;render();window.scrollTo(0,0);},
  mAddQ:function(){syncManual();var M=manualState();if(M.qs.length>=10)return;M.qs.push({text:'',kind:'pos'});render();var el=document.querySelector('[data-mq="'+(M.qs.length-1)+'"]');if(el)el.focus();},
  mDelQ:function(b){syncManual();var M=manualState();if(M.qs.length<=1)return;M.qs.splice(+b.getAttribute('data-i'),1);render();},
  mCreate:function(){
    syncManual();var M=manualState(),names=manualNames(M.names);
    var qs=M.qs.map(function(q){return {text:q.text.trim().replace(/\s+/g,' ').slice(0,160),kind:q.kind==='neg'?'neg':'pos'};}).filter(function(q){return q.text;});
    if(names.length<3){toast('Escribe al menos 3 estudiantes');var f=$('#m-names');if(f)f.focus();return;}
    if(names.length>80){toast('El máximo es 80 estudiantes por clase');return;}
    if(!qs.length){toast('Escribe al menos una pregunta');var g=document.querySelector('[data-mq="0"]');if(g)g.focus();return;}
    names.sort(function(a,b){return a.localeCompare(b,'es');});
    var c={id:uid('c'),name:(M.name.trim()||'Clase '+(state.classes.length+1)).slice(0,60),questions:qs.map(function(q,i){return {id:'m'+i,text:q.text,kind:q.kind};}),students:names.map(function(n){return {id:uid('s'),name:n};}),answers:{},notDup:[]};
    state.classes.push(c);state.activeId=c.id;
    ui.manual=null;ui.manualOn=false;ui.importing=false;ui.impName='';ui.view='entry';ui.editSid=c.students[0].id;ui.q='all';ui.selected=null;
    touch();render();window.scrollTo(0,0);toast('Clase creada. Ahora anota los papeles.');
  },
  entryWho:function(b){ui.editSid=b.getAttribute('data-id');render();var f=document.querySelector('.form .chip');if(f)f.focus();var fm=document.querySelector('.form');if(fm&&(window.innerWidth<860||fm.getBoundingClientRect().top<0))fm.scrollIntoView({block:'start'});},
  entryNext:function(){
    var c=cls();if(!c||!ui.editSid)return;
    if(!c.answers[ui.editSid])c.answers[ui.editSid]={};
    var ids=c.students.map(function(s){return s.id;}),ix=ids.indexOf(ui.editSid),next=null,i;
    for(i=1;i<ids.length;i++){var id=ids[(ix+i)%ids.length];if(!c.answers[id]){next=id;break;}}
    touch();
    if(next){ui.editSid=next;render();var f=document.querySelector('.form .chip');if(f)f.focus();var fm=document.querySelector('.form');if(fm&&fm.getBoundingClientRect().top<0)fm.scrollIntoView({block:'start'});}
    else{render();toast('Todos los papeles están anotados');}
  },
  impPaste:function(){
    var ta=$('#imp-paste');if(!ta||!ta.value.trim()){toast('Pega primero las celdas de la hoja');if(ta)ta.focus();return;}
    startReview(parseDelimited(ta.value),'Respuestas pegadas');
  },
  impSample:function(){var el=$('#imp-class');if(el&&!el.value.trim())el.value='5.º B (ejemplo)';startReview(parseDelimited(sampleTSV()),'5.º B (ejemplo)');},
  impCreate:function(){if(imp&&imp.result&&!imp.result.error)createFromImport();},
  addStudent:function(){
    var c=cls(),el=$('#f-add');if(!c||!el)return;
    var name=el.value.trim().replace(/\s+/g,' ').slice(0,60);
    if(!name){toast('Escribe el nombre');el.focus();return;}
    if(c.students.length>=80){toast('El máximo es 80 estudiantes por clase');return;}
    c.students.push({id:uid('s'),name:name});el.value='';ui.addName='';
    touch();render();var again=$('#f-add');if(again)again.focus();
  },
  addQuestion:function(){
    var c=cls(),el=$('#f-addq'),k=$('#f-addq-kind');if(!c||!el)return;
    var text=el.value.trim().replace(/\s+/g,' ').slice(0,160);
    if(!text){toast('Escribe la pregunta');el.focus();return;}
    if(c.questions.length>=20){toast('El máximo es 20 preguntas por clase');return;}
    var kind=k&&k.value==='neg'?'neg':'pos';
    c.questions.push({id:uid('q'),text:text,kind:kind});el.value='';ui.addQ='';ui.addQKind=kind;
    touch();render();toast('Pregunta agregada');var again=$('#f-addq');if(again)again.focus();
  },
  removeStudent:function(b){var c=cls();if(!c)return;removeStudent(c,b.getAttribute('data-id'));touch();render();},
  editWho:function(b){ui.editSid=b.getAttribute('data-id');render();var s=$('#f-sid');if(s){s.scrollIntoView({block:'start',behavior:'smooth'});s.focus();}},
  pick:function(b){
    var c=cls();if(!c||!ui.editSid)return;var q=b.getAttribute('data-q'),id=b.getAttribute('data-id');
    togglePick(c,ui.editSid,q,id);touch();render();
    var again=document.querySelector('.chip[data-q="'+q+'"][data-id="'+id+'"]');if(again)again.focus();
  },
  clearOne:function(){var c=cls();if(!c)return;delete c.answers[ui.editSid];touch();render();},
  arm:function(b){
    var key=b.getAttribute('data-key'),c=cls();if(!c)return;
    if(ui.armed!==key){
      unarm();ui.armed=key;b.classList.add('armed');b.textContent=b.getAttribute('data-confirm');
      clearTimeout(armT);armT=setTimeout(unarm,4000);return;
    }
    ui.armed=null;clearTimeout(armT);
    if(key.indexOf('delQ:')===0){
      var qid=key.slice(5);if(c.questions.length<=1)return;
      c.questions=c.questions.filter(function(q){return q.id!==qid;});

  dupYes:function(b){var c=cls();if(!c)return;mergeStudents(c,b.getAttribute('data-from'),b.getAttribute('data-into'));ui.selected=null;touch();render();toast('Nombres unidos');},
  dupNo:function(b){var c=cls();if(!c)return;c.notDup.push(b.getAttribute('data-key'));touch();render();},

var changes={
  switchClass:function(el){imp=null;ui.importing=false;ui.manualOn=false;state.activeId=el.value;ui.selected=null;ui.editSid=null;ui.q='all';ui.view='results';saveLocal();render();},
